[platformio]
default_envs = dev
boards_dir = boards
src_dir = main

[env]
; Pinned pioarduino release (ESP-IDF 5.5.x). Do not use "stable" in a long project.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = espidf
board = es3c35p
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

[env:dev]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.dev"

[env:release]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.release"

[env:diag]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.diag"

; Used by tools/bench_matrix.sh: diag build plus per-run overrides in sdkconfig.defaults.bench
[env:bench]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.diag;sdkconfig.defaults.bench"
